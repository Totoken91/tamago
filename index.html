<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#eafbe4" />
  <title>TamaLove</title>
  <style>
    :root {
      --ink: #2f4718;
      --card: rgba(255, 255, 255, 0.62);
      --card-brd: rgba(255, 255, 255, 0.8);
      --accent: #8fce38;
      --accent-deep: #6fb023;
      --pink: #ff77a1;
      --shadow: 0 10px 30px rgba(80, 110, 40, 0.18);
      font-family: 'Baloo 2', 'Segoe UI', 'Nunito', system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #dfeffb;
      overscroll-behavior: none;                 /* pas de pull-to-refresh */
      position: fixed; inset: 0; width: 100%;     /* fige la page sur mobile */
      -webkit-user-select: none; user-select: none;
    }
    #scene {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: none;                        /* le drag = caresse, pas scroll/zoom */
      -webkit-touch-callout: none;
    }

    /* ---- vignette CSS (remplace le post-process, gratuit) ---- */
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(255,247,214,0.12), rgba(255,247,214,0) 46%),
        radial-gradient(ellipse 80% 80% at 50% 48%, rgba(0,0,0,0) 56%, rgba(28,38,14,0.34) 100%);
    }

    /* ---- calque UI ---- */
    #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; z-index: 2; }
    #ui > * { pointer-events: auto; }

    /* ---- carte nom + humeur (haut gauche) ---- */
    #pet-card {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top)); left: calc(18px + env(safe-area-inset-left));
      background: var(--card); border: 1px solid var(--card-brd);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow);
      max-width: 62vw;
    }
    #pet-name {
      font-size: 22px; font-weight: 800; color: var(--ink);
      background: transparent; border: none; border-bottom: 2px dashed transparent;
      width: 190px; max-width: 52vw; padding: 0 0 2px; outline: none;
    }
    #pet-name:focus { border-bottom-color: var(--accent); }
    #mood-label { font-size: 13px; font-weight: 700; color: var(--accent-deep); margin-top: 4px; }
    #mood-text { font-size: 13px; color: #6a7d55; margin-top: 2px; font-style: italic; min-height: 16px; }

    /* ---- jauge cœur (haut droite) ---- */
    #gauge {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top)); right: calc(18px + env(safe-area-inset-right));
      background: var(--card); border: 1px solid var(--card-brd);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 20px; padding: 12px; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 10px;
    }
    .heart-wrap {
      position: relative; width: 58px; height: 56px;
      transform-origin: 50% 60%; animation: beat 1.7s ease-in-out infinite;
      filter: drop-shadow(0 3px 6px rgba(255, 92, 134, 0.22));
    }
    .heart-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    /* battement de cœur : rythme selon l'humeur */
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12); }
      30% { transform: scale(1.0); }
      45% { transform: scale(1.07); }
    }
    body[data-mood="radiant"]     .heart-wrap { animation-duration: 0.95s; }
    body[data-mood="content"]     .heart-wrap { animation-duration: 1.7s; }
    body[data-mood="melancholic"] .heart-wrap { animation-duration: 2.6s; }
    body[data-mood="needy"]       .heart-wrap { animation-duration: 3.6s; }
    .gauge-txt { display: flex; flex-direction: column; }
    #gauge-pct {
      font-size: 22px; font-weight: 800; line-height: 1;
      color: #ff5c86; min-width: 48px; text-align: center;
      font-variant-numeric: tabular-nums;
    }
    #gauge-label { font-size: 10px; color: #b58aa0; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; margin-bottom: 3px; }

    /* ---- barre d'actions (bas centre) ---- */
    #actions {
      position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 0 12px;
    }
    .act {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-width: 96px; padding: 12px 16px 10px;
      border: 1px solid var(--card-brd); border-radius: 20px;
      background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow); cursor: pointer; color: var(--ink);
      font-family: inherit; font-weight: 800; font-size: 15px;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .act:hover { transform: translateY(-3px); }
    .act:active { transform: translateY(0) scale(.96); }
    .act .emoji { font-size: 26px; line-height: 1; }
    .act .cd-num { font-size: 11px; color: var(--accent-deep); height: 12px; }
    .act .cd-fill {
      position: absolute; inset: 0; top: auto; height: 100%;
      background: rgba(120, 150, 70, 0.28); transform-origin: bottom; transform: scaleY(0);
      pointer-events: none;
    }
    .act.cooling { cursor: default; filter: grayscale(.35) opacity(.85); }
    .act.cooling:hover { transform: none; }

    /* ---- indice caresse ---- */
    #hint {
      position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%);
      font-size: 13px; font-weight: 700; color: #6a7d55;
      background: var(--card); padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--card-brd); box-shadow: var(--shadow);
      opacity: .9; transition: opacity .6s ease; pointer-events: none;
    }
    #hint.gone { opacity: 0; }

    /* ---- mots doux flottants (purement visuel, laisse passer les clics) ---- */
    #words { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .sweet-word {
      position: absolute; transform: translate(-50%, -50%) rotate(var(--tilt));
      font-weight: 800; font-size: 20px; color: #ff5c86;
      text-shadow: 0 2px 10px rgba(255, 120, 160, .35), 0 0 2px #fff;
      white-space: nowrap; animation: floatUp 2.2s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.6) rotate(var(--tilt)); }
      18%  { opacity: 1; transform: translate(-50%, -70%) scale(1.08) rotate(var(--tilt)); }
      100% { opacity: 0; transform: translate(-50%, -190%) scale(1) rotate(var(--tilt)); }
    }

    /* ---- toast ---- */
    #toast {
      position: absolute; left: 50%; top: 84px; transform: translate(-50%, -14px);
      background: rgba(47, 71, 24, 0.9); color: #f4ffe0; font-weight: 700; font-size: 14px;
      padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow);
      opacity: 0; transition: opacity .4s ease, transform .4s ease; pointer-events: none;
      max-width: 80vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---- écran de chargement (splash soigné) ---- */
    #loader {
      position: fixed; inset: 0; z-index: 50; display: flex;
      align-items: center; justify-content: center;
      background:
        radial-gradient(120% 90% at 50% 18%, #f3ffe0 0%, #e4f7ea 42%, #d4ecf6 100%);
      transition: opacity .55s ease, transform .55s ease;
    }
    #loader.hidden { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #loader::after {  /* vignette douce */
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 75% 75% at 50% 46%, transparent 60%, rgba(30,50,20,0.14) 100%);
    }
    .splash { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .pet-stage { position: relative; width: 160px; height: 168px; margin-bottom: 6px; }
    .loader-pet {
      width: 150px; height: auto; position: absolute; left: 50%; bottom: 8px;
      transform-origin: 50% 100%; translate: -50% 0;
      animation: petbounce 1.25s cubic-bezier(.5,.05,.5,.95) infinite;
      filter: drop-shadow(0 10px 16px rgba(120,176,35,.28));
      -webkit-user-select: none; user-select: none;
    }
    .pet-shadow {
      position: absolute; left: 50%; bottom: 2px; width: 96px; height: 20px;
      translate: -50% 0; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(90,120,40,.35), rgba(90,120,40,0) 70%);
      animation: petshadow 1.25s cubic-bezier(.5,.05,.5,.95) infinite;
    }
    @keyframes petbounce {
      0%   { transform: translateY(0)     scale(1.06, 0.94); }
      20%  { transform: translateY(-10px) scale(1, 1); }
      50%  { transform: translateY(-40px) scale(0.97, 1.05); }
      80%  { transform: translateY(-10px) scale(1, 1); }
      100% { transform: translateY(0)     scale(1.06, 0.94); }
    }
    @keyframes petshadow {
      0%, 100% { transform: scale(1.05); opacity: .5; }
      50%      { transform: scale(.62);  opacity: .24; }
    }
    .logo {
      margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -.01em;
      color: #5a8f22; line-height: 1;
    }
    .logo span { color: #ff5c86; }
    .tag { margin: 6px 0 0; color: #6f9152; font-size: 14px; font-weight: 600; }
    .dots { display: flex; gap: 10px; margin-top: 20px; }
    .dots i {
      width: 11px; height: 11px; border-radius: 50%;
      background: #ff7ba3; display: inline-block;
      animation: dotpulse 1.1s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: .16s; background: #ffa1c0; }
    .dots i:nth-child(3) { animation-delay: .32s; background: #ff7ba3; }
    @keyframes dotpulse {
      0%, 100% { transform: translateY(0) scale(1); opacity: .5; }
      40%      { transform: translateY(-8px) scale(1.15); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-pet, .pet-shadow, .dots i, .heart-wrap { animation: none; }
    }

    @media (max-width: 560px) {
      #pet-card, #gauge { padding: 8px 11px; }
      #pet-card { max-width: 56vw; }
      #pet-name { font-size: 17px; width: 150px; }
      #mood-text { display: none; }               /* garde la carte compacte */
      .heart-wrap { width: 46px; height: 44px; }
      #gauge-pct { font-size: 17px; min-width: 40px; }
      #gauge-label { display: none; }
      /* barre d'action : une seule rangée, boutons qui se partagent la largeur */
      #actions {
        gap: 8px; transform: none; flex-wrap: nowrap;
        bottom: calc(12px + env(safe-area-inset-bottom));
        left: calc(8px + env(safe-area-inset-left));
        right: calc(8px + env(safe-area-inset-right));
        padding: 0;
      }
      .act { flex: 1 1 0; min-width: 0; min-height: 56px; padding: 8px 4px 7px; font-size: 12px; border-radius: 16px; }
      .act .emoji { font-size: 20px; }
      #hint { display: none; }                     /* la caresse marche quand même */
      #toast { top: auto; bottom: calc(84px + env(safe-area-inset-bottom)); font-size: 13px; }
    }

    /* écrans bas (mobile paysage) : HUD compact pour libérer de la hauteur */
    @media (max-height: 480px) {
      #pet-card, #gauge { padding: 7px 10px; }
      #pet-name { font-size: 16px; width: 130px; }
      #mood-text { display: none; }
      .heart-wrap { width: 40px; height: 38px; }
      #gauge-pct { font-size: 16px; }
      #gauge-label { display: none; }
      #hint { display: none; }
      #actions { gap: 8px; bottom: calc(8px + env(safe-area-inset-bottom));
                 left: auto; right: calc(10px + env(safe-area-inset-right)); transform: none; flex-wrap: nowrap; }
      .act { min-width: 84px; min-height: 52px; padding: 6px 10px; font-size: 12px; }
      .act .emoji { font-size: 18px; }
    }
  </style>
</head>
<body data-mood="content">
  <canvas id="scene"></canvas>
  <!-- vignette + ambiance chaude (CSS, aucun coût GPU dans la boucle de rendu) -->
  <div id="vignette"></div>

  <!-- calque interface -->
  <div id="ui">
    <div id="pet-card">
      <input id="pet-name" maxlength="16" spellcheck="false" aria-label="Nom de la créature" />
      <div id="mood-label">Content·e 🙂</div>
      <div id="mood-text"></div>
    </div>

    <div id="gauge">
      <div class="heart-wrap">
        <svg class="heart-svg" viewBox="0 0 100 94" aria-hidden="true">
          <defs>
            <path id="hp" d="M50 88 C 20 65 4 45 4 27 C 4 12 16 3 29 3 C 39 3 46 9 50 17 C 54 9 61 3 71 3 C 84 3 96 12 96 27 C 96 45 80 65 50 88 Z"/>
            <clipPath id="heartClip"><use href="#hp"/></clipPath>
            <linearGradient id="hg" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%"  stop-color="#ff4f7e"/>
              <stop offset="55%" stop-color="#ff6f9c"/>
              <stop offset="100%" stop-color="#ff9ec4"/>
            </linearGradient>
            <radialGradient id="hgloss" cx="34%" cy="24%" r="46%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
            <filter id="hshadow" x="-30%" y="-25%" width="160%" height="165%">
              <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#ff5c86" flood-opacity="0.4"/>
            </filter>
          </defs>
          <!-- coquille du cœur (vide) -->
          <use href="#hp" fill="#ffe6ee" stroke="#ffc2d5" stroke-width="2.5" filter="url(#hshadow)"/>
          <!-- remplissage animé (scaleY piloté par le JS) -->
          <g clip-path="url(#heartClip)">
            <rect id="gauge-fill" x="0" y="0" width="100" height="94" fill="url(#hg)"
                  style="transform-box: fill-box; transform-origin: bottom; transform: scaleY(.7);"/>
          </g>
          <!-- reflet verre + contour net -->
          <use href="#hp" fill="url(#hgloss)"/>
          <use href="#hp" fill="none" stroke="#ff7ba3" stroke-width="2.5"/>
        </svg>
      </div>
      <div class="gauge-txt">
        <div id="gauge-label">Amour</div>
        <div id="gauge-pct">70%</div>
      </div>
    </div>

    <div id="hint">Caresse-moi ✋ (clique &amp; glisse)</div>

    <div id="actions">
      <button class="act" id="btn-hug"><span class="cd-fill"></span><span class="emoji">🤗</span>Câlin<span class="cd-num"></span></button>
      <button class="act" id="btn-compliment"><span class="cd-fill"></span><span class="emoji">💬</span>Complimenter<span class="cd-num"></span></button>
      <button class="act" id="btn-play"><span class="cd-fill"></span><span class="emoji">🎈</span>Jouer<span class="cd-num"></span></button>
    </div>

    <div id="words"></div>
    <div id="toast"></div>
  </div>

  <!-- écran de chargement -->
  <div id="loader">
    <div class="splash">
      <div class="pet-stage">
        <img class="loader-pet" src="./assets/tamagogo.png" alt="" draggable="false" />
        <span class="pet-shadow"></span>
      </div>
      <h1 class="logo">Tama<span>Love</span></h1>
      <p class="tag">un petit compagnon nourri d'amour</p>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
  </div>

  <!-- Three.js (r160) livré localement dans vendor/ — aucun accès réseau requis -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

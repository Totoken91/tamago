<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f4fbff"/>
      <stop offset="55%" stop-color="#e8f5ff"/>
      <stop offset="100%" stop-color="#dcefff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#eaf4fb"/>
      <stop offset="100%" stop-color="#cfe6f4"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="38%" r="60%">
      <stop offset="0%"  stop-color="#fffbe6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="50%" cy="40%" r="70%">
      <stop offset="0%"  stop-color="#eaf7ff"/>
      <stop offset="60%" stop-color="#bfe6ff"/>
      <stop offset="100%" stop-color="#8fd0f5"/>
    </radialGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#d6ee6a"/>
      <stop offset="100%" stop-color="#b6d84a"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d3ec5a"/>
      <stop offset="100%" stop-color="#a7cf34"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f77e"/>
      <stop offset="100%" stop-color="#c2e24a"/>
    </linearGradient>
  </defs>

  <!-- walls & floor -->
  <rect width="1600" height="640" fill="url(#wall)"/>
  <path d="M0 640 L1600 640 L1600 900 L0 900 Z" fill="url(#floor)"/>
  <ellipse cx="800" cy="360" rx="900" ry="520" fill="url(#warm)"/>

  <!-- ================= LEFT : door ================= -->
  <g>
    <rect x="70" y="150" width="230" height="470" rx="115" fill="#eef8b8"/>
    <rect x="92" y="168" width="186" height="452" rx="93" fill="#f7ffd9"/>
    <rect x="92" y="168" width="186" height="452" rx="93" fill="none" stroke="#c9e85e" stroke-width="10"/>
    <circle cx="255" cy="400" r="9" fill="#b6d84a"/>
    <!-- little mascot etched on door -->
    <g transform="translate(160,330)" fill="#c9e85e" opacity="0.85">
      <circle cx="25" cy="35" r="30"/>
      <circle cx="25" cy="-2" r="12"/>
      <circle cx="16" cy="32" r="4.5" fill="#7fae2a"/>
      <circle cx="34" cy="32" r="4.5" fill="#7fae2a"/>
    </g>
    <ellipse cx="185" cy="640" rx="120" ry="26" fill="#c6e262" opacity="0.6"/>
  </g>

  <!-- ================= shelves left ================= -->
  <g>
    <rect x="360" y="360" width="180" height="26" rx="13" fill="#eef6fb"/>
    <rect x="360" y="360" width="180" height="26" rx="13" fill="none" stroke="#dfeaf2" stroke-width="2"/>
    <!-- books -->
    <rect x="378" y="322" width="16" height="40" rx="3" fill="#b6d84a"/>
    <rect x="398" y="314" width="16" height="48" rx="3" fill="#8fd0f5"/>
    <rect x="418" y="326" width="16" height="36" rx="3" fill="#d3ec5a"/>
    <rect x="438" y="318" width="16" height="44" rx="3" fill="#c8e26a"/>
    <!-- glass orb -->
    <circle cx="500" cy="344" r="20" fill="#bfe8ff" opacity="0.75"/>
    <circle cx="493" cy="337" r="6" fill="#ffffff" opacity="0.9"/>

    <rect x="360" y="250" width="150" height="24" rx="12" fill="#eef6fb"/>
    <!-- terrarium dome -->
    <circle cx="435" cy="222" r="42" fill="#cdeeff" opacity="0.6"/>
    <ellipse cx="435" cy="252" rx="42" ry="12" fill="#eef6fb"/>
    <g transform="translate(435,236)">
      <rect x="-3" y="0" width="6" height="16" fill="#8ccd33"/>
      <path d="M0 2 q -16 -10 -22 2 q 14 4 22 -2" fill="#9ad83a"/>
      <path d="M0 2 q 16 -10 22 2 q -14 4 -22 -2" fill="#9ad83a"/>
    </g>
    <circle cx="418" cy="212" r="8" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- ================= CENTER : bubble window ================= -->
  <g>
    <!-- fused bubble frame -->
    <g fill="url(#frameG)">
      <circle cx="800" cy="330" r="235"/>
      <circle cx="1010" cy="370" r="150"/>
      <circle cx="905" cy="150" r="55"/>
    </g>
    <!-- glass -->
    <circle cx="800" cy="330" r="205" fill="url(#sky)"/>
    <circle cx="1010" cy="370" r="122" fill="url(#sky)"/>
    <!-- distant future city -->
    <clipPath id="win1"><circle cx="800" cy="330" r="205"/></clipPath>
    <g clip-path="url(#win1)">
      <rect x="595" y="330" width="410" height="205" fill="#bfe6a8" opacity="0.5"/>
      <g fill="#e9f6ff" opacity="0.9">
        <rect x="660" y="300" width="34" height="150" rx="8"/>
        <rect x="705" y="250" width="26" height="200" rx="8"/>
        <rect x="880" y="280" width="40" height="170" rx="10"/>
        <rect x="930" y="320" width="24" height="130" rx="8"/>
      </g>
      <!-- domed tower -->
      <g transform="translate(800,300)">
        <rect x="-16" y="0" width="32" height="150" rx="6" fill="#f2fbff"/>
        <circle cx="0" cy="-6" r="26" fill="#d8f0ff"/>
      </g>
      <!-- bridge -->
      <path d="M595 470 q 205 -70 410 0" fill="none" stroke="#f2fbff" stroke-width="14" opacity="0.9"/>
      <!-- clouds -->
      <g fill="#ffffff" opacity="0.9">
        <ellipse cx="700" cy="220" rx="46" ry="20"/>
        <ellipse cx="740" cy="212" rx="34" ry="18"/>
        <ellipse cx="900" cy="200" rx="40" ry="18"/>
      </g>
    </g>
    <clipPath id="win2"><circle cx="1010" cy="370" r="122"/></clipPath>
    <g clip-path="url(#win2)">
      <rect x="888" y="370" width="244" height="122" fill="#bfe6a8" opacity="0.5"/>
      <g fill="#e9f6ff" opacity="0.9">
        <rect x="960" y="300" width="26" height="130" rx="8"/>
        <rect x="1030" y="320" width="30" height="110" rx="8"/>
      </g>
    </g>
    <!-- glass shine -->
    <path d="M690 210 q 60 -30 120 0 q -50 40 -120 60 z" fill="#ffffff" opacity="0.35"/>
    <circle cx="960" cy="320" r="26" fill="#ffffff" opacity="0.28"/>
  </g>

  <!-- ================= RIGHT : frame + shelf + plant ================= -->
  <g>
    <!-- framed portrait of the creature -->
    <rect x="1300" y="210" width="150" height="170" rx="14" fill="url(#frameG)"/>
    <rect x="1316" y="226" width="118" height="138" rx="8" fill="#eaf7c4"/>
    <g transform="translate(1375,300)">
      <circle cx="0" cy="12" r="34" fill="#9ad83a"/>
      <circle cx="0" cy="-26" r="13" fill="#9ad83a"/>
      <circle cx="-11" cy="8" r="5" fill="#274012"/>
      <circle cx="11" cy="8" r="5" fill="#274012"/>
      <circle cx="-13" cy="5" r="1.8" fill="#fff"/>
      <circle cx="9" cy="5" r="1.8" fill="#fff"/>
    </g>
    <line x1="1375" y1="205" x2="1355" y2="180" stroke="#c9e85e" stroke-width="4"/>
    <line x1="1375" y1="205" x2="1395" y2="180" stroke="#c9e85e" stroke-width="4"/>
    <circle cx="1375" cy="176" r="6" fill="#b6d84a"/>

    <!-- shelf + potted plant + orb -->
    <rect x="1300" y="440" width="240" height="26" rx="13" fill="#eaf6b6"/>
    <g transform="translate(1470,360)">
      <path d="M-30 80 L30 80 L22 118 L-22 118 Z" fill="#f4fbff"/>
      <path d="M0 78 C -8 30 -46 26 -54 -6 C -20 4 -6 34 0 78" fill="#7fc23a"/>
      <path d="M0 78 C 8 22 44 24 54 -8 C 20 6 8 34 0 78" fill="#9ad83a"/>
      <path d="M0 80 C -2 20 0 -20 4 -50 C 12 -10 8 40 0 80" fill="#8ccd33"/>
    </g>
    <circle cx="1345" cy="452" r="22" fill="#bfe8ff" opacity="0.7"/>
    <circle cx="1338" cy="445" r="6" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- puddle blobs on floor -->
  <ellipse cx="1210" cy="770" rx="70" ry="20" fill="#bfe8ff" opacity="0.55"/>
  <ellipse cx="1195" cy="765" rx="30" ry="9" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="300" cy="815" rx="55" ry="16" fill="#bfe8ff" opacity="0.45"/>

  <!-- ================= round rug ================= -->
  <ellipse cx="800" cy="770" rx="470" ry="120" fill="url(#rug)"/>
  <ellipse cx="800" cy="760" rx="470" ry="120" fill="#e2f490" opacity="0.5"/>
  <ellipse cx="800" cy="756" rx="380" ry="92" fill="#cbe86a" opacity="0.55"/>

  <!-- soft floor reflection of window -->
  <ellipse cx="800" cy="700" rx="260" ry="40" fill="#eafaff" opacity="0.4"/>
</svg>
